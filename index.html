<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diciembre en familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm family planner, holiday at the beach, easy for every age.
   IDEA: a paper wall calendar hung in the beach house kitchen.
   PICTURE: the December grid itself, with the visit days (18 to 28) washed in sea blue.
   COLOUR and TYPE: flag blue #0b3d91 dominant, sand white, poinsettia red accent; slot dots sun/sea/night. Gloock + Figtree.
   LAYOUT: modest title, grid fills the page, day sheet slides in; under 640px the grid becomes an agenda list. */
:root{color-scheme:light dark;
--bg:light-dark(#fbf8f2,#0c1526);--card:light-dark(#ffffff,#13203a);--ink:light-dark(#12213d,#eef2fa);--mute:light-dark(#5d6880,#9aa7c2);
--line:light-dark(#e6e0d4,#24324f);--blue:light-dark(#0b3d91,#6f9cf0);--wash:light-dark(#e7eefb,#16284a);--red:light-dark(#c8102e,#ff6b7d);
--m:light-dark(#e09a00,#ffc44d);--t:light-dark(#0e8a8a,#3fd0c9);--n:light-dark(#3a3f9e,#9aa0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3.5vw,48px) max(4vw,14px);max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}
h1{font:400 clamp(32px,5vw,50px)/1.05 Gloock,Georgia,serif;margin:0;color:var(--blue);text-wrap:balance}
.sub{margin:6px 0 0;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--mute);align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;flex:none}
.d-manana{background:var(--m)}.d-tarde{background:var(--t)}.d-noche{background:var(--n)}
button{font:inherit;cursor:pointer}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--blue);color:#fff;font-weight:700}
:root[data-theme=dark] .btn{color:#0c1526}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#0c1526}}
.btn:focus-visible,.cell:focus-visible,.x:focus-visible,input:focus-visible,select:focus-visible,.ghost:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.status{font-size:14px;color:var(--mute);margin:0 0 12px;min-height:1.5em}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(11,61,145,.35)}
.wd{padding:10px;font-size:13px;font-weight:700;color:var(--mute);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cell{position:relative;min-height:128px;padding:8px 8px 10px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;display:flex;flex-direction:column;gap:4px}
.cell.visit{background:var(--wash)}
.cell.empty{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 45%,transparent) 8px 9px);cursor:default}
.cell.off{cursor:default;opacity:.45}.cell.off .num{font-size:18px}
.cell:not(.empty):not(.off):hover{box-shadow:inset 0 0 0 2px var(--blue)}
.num{font:400 22px/1 Gloock,Georgia,serif;display:flex;justify-content:space-between;align-items:center}
.cell.xmas .num{color:var(--red)}
.tag{font:600 11px/1 Figtree,sans-serif;color:var(--red)}
.chip{display:flex;gap:6px;align-items:baseline;font-size:13px;line-height:1.25}
.chip .dot{transform:translateY(-1px)}
.chip span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.more{font-size:12px;color:var(--mute)}
.agenda{display:none}
.aday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;color:inherit;display:grid;grid-template-columns:58px 1fr;gap:12px}
.aday.visit{background:var(--wash)}
.aday .num{flex-direction:column;align-items:flex-start;gap:2px;font-size:28px}
.aday .num small{font:600 12px Figtree,sans-serif;color:var(--mute)}
.aday .none{color:var(--mute);font-size:14px}
@media(max-width:640px){.grid{display:none}.agenda{display:block}.show-all{display:inline-flex}}
.show-all{display:none;margin:4px 0 14px}
.ghost{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(8,16,34,.45);display:none;z-index:5}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--bg);z-index:6;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
.open .scrim{display:block}.open .sheet{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sh-head{padding:20px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;gap:10px}
.sh-head h2{font:400 32px/1.05 Gloock,Georgia,serif;margin:0;color:var(--blue)}
.sh-head p{margin:4px 0 0;color:var(--mute);font-size:14px}
.sh-body{padding:8px 20px 20px;overflow:auto;flex:1}
.slot h3{font-size:14px;font-weight:700;margin:16px 0 6px;display:flex;align-items:center;color:var(--mute)}
.ev{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:6px}
.ev .tx{flex:1}.ev .by{display:block;font-size:12px;color:var(--mute)}
.x{min-width:44px;min-height:44px;border-radius:8px;border:0;background:none;color:var(--mute);font-size:14px;font-weight:600}
.x.arm{background:var(--red);color:#fff;padding:0 10px}
.slot .nil{color:var(--mute);font-size:14px;margin:0 0 6px}
form{border-top:1px solid var(--line);padding:16px 20px 22px;display:grid;gap:10px;background:var(--card)}
form label{font-size:13px;font-weight:600;color:var(--mute)}
input,select{font:inherit;font-size:16px;min-height:44px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:999px;display:none;align-items:center;gap:12px;z-index:9;font-size:15px;max-width:calc(100% - 24px)}
.toast.on{display:flex}.toast button{min-height:36px;border:0;border-radius:999px;padding:0 14px;background:var(--bg);color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="band">
  <header>
    <div>
      <h1>Diciembre en familia</h1>
      <p class="sub">Itinerario de visitas, 18 al 28 de diciembre de 2026. Toca un día del 18 al 28 para ver, agregar o quitar planes.</p>
    </div>
    <div class="legend">
      <span><i class="dot d-manana"></i>Mañana</span><span><i class="dot d-tarde"></i>Tarde</span><span><i class="dot d-noche"></i>Noche</span>
      <button class="btn" id="addBtn" type="button">+ Agregar plan</button>
    </div>
  </header>
  <p class="status" id="status" role="status">Cargando el calendario…</p>
  <div class="grid" id="grid"></div>
  <div class="agenda" id="agenda"></div>
</div>

<div id="wrap">
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="shTitle">
    <div class="sh-head">
      <div><h2 id="shTitle"></h2><p id="shSub"></p></div>
      <button class="x" id="closeBtn" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="sh-body" id="shBody"></div>
    <form id="form" autocomplete="off">
      <label for="fTitle">Nuevo plan</label>
      <input id="fTitle" maxlength="120" placeholder="Ej. Almuerzo en casa de la abuela" required>
      <div class="row">
        <div><label for="fDay">Día</label><select id="fDay"></select></div>
        <div><label for="fSlot">Horario</label><select id="fSlot"><option value="manana">Mañana</option><option value="tarde">Tarde</option><option value="noche">Noche</option></select></div>
      </div>
      <button class="btn" type="submit" id="fSave">Guardar plan</button>
    </form>
  </aside>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button type="button" id="undoBtn">Deshacer</button></div>

<script type="module" src="app.js"></script>
</body>
</html>
